trigger:
 branches:
   include:
     - main
pr:
 branches:
   include:
     - main
pool:
  name: skyline-agent

stages:
- stage:
  jobs:
  - job:
    displayName: Tearrform init and validate
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/UAT'
        backendServiceArm: 'test-svc'
        backendAzureRmResourceGroupName: 'test-rg'
        backendAzureRmStorageAccountName: 'teststrg678'
        backendAzureRmContainerName: 'test-container'
        backendAzureRmKey: 'test.tfstate'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/UAT'
        environmentServiceNameAzureRM: 'test-svc'
        commandOptions: '-input=false'
- stage: scanstage
  displayName: run kargea tfsec or tflint 
  jobs:
  - job: tfsec
    displayName: run tfsec
    steps:
    - checkout: self

    # tfsec Security Scan
    - script: |
        echo "===== tfsec Version ====="
        tfsec --version

        echo "===== Starting tfsec Scan ====="
        tfsec "$(Build.SourcesDirectory)"
      displayName: tfsec Security Scan
      continueOnError: true
      # TFLint Code Quality Scan
    - script: |
        echo "===== TFLint Version ====="
        tflint --version

        echo "===== TFLint Initialization ====="
        cd "$(Build.SourcesDirectory)"
        tflint --init

        echo "===== Starting TFLint Scan ====="
        tflint --recursive
      displayName: TFLint Code Quality Scan
      continueOnError: true

- stage: 
  pool: server
  jobs:
    - job:
      displayName: mai chala raha hu manual validation
      steps:
      - task: ManualValidation@1
        inputs:
          notifyUsers: 'sanjaytanwar450@gmail.com'
          approvers: 'sanjaytanwar450@gmail.com'
          instructions: 'Approve kar do bhai'

- stage: 
  jobs:
    - job: 
      displayName: finally apply kar do
      steps:
      - task: TerraformTask@5
        inputs:
         provider: 'azurerm'
         command: 'init'
         workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/UAT'
         backendServiceArm: 'test-svc'
         backendAzureRmResourceGroupName: 'test-rg'
         backendAzureRmStorageAccountName: 'teststrg678'
         backendAzureRmContainerName: 'test-container'
         backendAzureRmKey: 'test.tfstate'
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'apply'
          workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/UAT'
          environmentServiceNameAzureRM: 'test-svc'
          commandOptions: '-input=false'


